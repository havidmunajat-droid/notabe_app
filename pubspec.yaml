name: notabe_app
description: NotaBe - Nota Rapih, Bisnis Lancar
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  provider: ^6.1.1
  go_router: ^13.0.0
  card_swiper: ^3.0.1
  intl: ^0.19.0
  fl_chart: ^0.66.0
  shared_preferences: ^2.2.2
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#00164D"
  adaptive_icon_foreground: "assets/images/logo.png"
  
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/